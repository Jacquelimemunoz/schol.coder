<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
</head>
<body>
    <header>

        <a href="../index.html">
            <img src="../img/logo.png" alt="">
        </a>
    
        <nav>
            <ul>
                <!-- ejemplo enlace relativo para volver a la home -->
                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>
                <li>productos</li>
                <li>contacto</li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ejemplo de tablas  -->

        <table border="3" align="center">
            <th> horarios </th>

            <tr>
                <td>
                    lunes
                </td>
                <td>
                    martes
                </td>
                <td>
                    miercoles
                </td>
            </tr>

            <tr>
                <td>
                    9 a 11
                </td>

                <td>
                    9 a 11
                </td>

                <td>
                    9 a 11
                </td>
            </tr>
        </table>

    </main>

    <section>
        <!-- formularios  -->

        <form>
            <fieldset>
                <legend> completa tus datos</legend>

                <div>
                     <!-- campo para completar el nombre -->
                    <label for="nombre"> Nombre y Apellido</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="aca tenes que colocar tu nombre">
                </div>
               
                <div>
                    <!-- campo para correo electronico -->
                    <label for="correo"> Email </label>
                    <input type="email" id="correo" name="correo">
                </div>
                
                <div>
                    <!-- campo para contraseña -->
                     <label for="password"> Completa tu contraseña</label>
                     <input type="password" id="password" name="password">
                </div>

                <div>
                    <!-- campo para msj -->
                     <label for=""> Dejanos tu msj</label>
                     <textarea name="" id="" rows="5" cols="30" placeholder="dejanos todo lo que quieras preguntar pero no te pongas ansioso"> </textarea>
                </div>

                <div>
                    <!-- botones de enviar y borrar -->
                    <input type="submit" value="envianos tus consultas">
                    <input type="reset" value="si me tocas borras todo">
                </div>
            </fieldset>
        </form>
    </section>
</body>
</html>
